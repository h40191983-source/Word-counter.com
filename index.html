    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Word & Character Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
            --stat-bg: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--stat-bg);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .textarea-container {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: var(--stat-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Word Counter Pro</h1>
        <p>Analyze your text in real time</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="wordCount">0</div>
            <div class="stat-label">Words</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="charCount">0</div>
            <div class="stat-label">Characters</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="readingTime">0 min</div>
            <div class="stat-label">Reading Time</div>
        </div>
    </div>

    <div class="textarea-container">
        <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
    </div>

    <div class="actions">
        <button class="btn btn-secondary" onclick="clearText()">Clear</button>
        <button class="btn" onclick="copyText()">Copy Text</button>
    </div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const readingTime = document.getElementById('readingTime');

    textInput.addEventListener('input', updateStats);

    function updateStats() {
        const text = textInput.value;
        
        // Characters
        charCount.innerText = text.length;

        // Words
        const words = text.trim().split(/\s+/).filter(word => word.length > 0);
        wordCount.innerText = words.length;

        // Reading Time (Average 200 words per minute)
        const time = Math.ceil(words.length / 200);
        readingTime.innerText = words.length === 0 ? '0 min' : `${time} min`;
    }

    function clearText() {
        textInput.value = '';
        updateStats();
    }

    function copyText() {
        if (!textInput.value) return;
        textInput.select();
        navigator.clipboard.writeText(textInput.value);
        alert('Text copied to clipboard!');
    }
</script>

</body>
</html>
